name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: mini_auction_test
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      JWT_SECRET_KEY: this-is-a-test-only-jwt-secret-with-at-least-32-bytes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Start MongoDB replica set for transaction tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name mini-auction-mongo \
            --publish 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec mini-auction-mongo mongosh --quiet \
              --eval 'db.adminCommand({ping: 1}).ok' 2>/dev/null | grep -qx '1'; then
              break
            fi
            sleep 2
          done
          docker exec mini-auction-mongo mongosh --quiet \
            --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          ready=0
          for i in $(seq 1 40); do
            if docker exec mini-auction-mongo mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx 'true'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Lint with Ruff
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest tests -q
